services:
  review-api:
    build: .
    ports: ["127.0.0.1:8080:8080"]
    environment:
      DEMO_ACCESS_CODE: ${DEMO_ACCESS_CODE:?Set via secret environment}
      ALLOWED_ORIGINS: https://newprojectshkau.github.io
      COOKIE_SECURE: "true"
      DATABASE_PATH: /data/reviews.sqlite3
    volumes: ["review-data:/data"]
    restart: unless-stopped
volumes:
  review-data:
