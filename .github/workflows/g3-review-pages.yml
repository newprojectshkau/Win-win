name: G3 review platform
on:
  push:
    branches: [g3-platform-review]
    paths:
      - "sites/g3-platform/**"
      - "scripts/marketdata/**"
      - ".github/workflows/g3-review-pages.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: g3-review-pages
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify strategy fixtures and replay invariants
        run: npm test --prefix sites/g3-platform
      - name: Verify private data adapter with offline fixtures
        run: python3 -m unittest discover -s scripts/marketdata -p 'test_*.py' -v
      - name: Prepare review-only static site
        shell: bash
        run: |
          mkdir -p _site
          cp sites/g3-platform/index.html sites/g3-platform/review.html sites/g3-platform/dataset-store.js sites/g3-platform/styles.css sites/g3-platform/app.js sites/g3-platform/engine.js sites/g3-platform/assumptions.js sites/g3-platform/performance.js sites/g3-platform/simulator.html sites/g3-platform/simulator.css sites/g3-platform/simulator.js sites/g3-platform/private-download.html sites/g3-platform/private-download.js sites/g3-platform/market-expanded-30days.enc sites/g3-platform/market-review.enc sites/g3-platform/market-aapl-history.enc sites/g3-platform/presentation.js sites/g3-platform/quality-audit.js _site/
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path('_site/build.json').write_text(json.dumps({
              'revision': os.environ['GITHUB_SHA'],
              'ref': os.environ['GITHUB_REF_NAME'],
              'engineVersion': '0.2.0-review'
          }))
          Path('_site/.nojekyll').touch()
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Read Pages configuration
        uses: actions/configure-pages@v5
      - name: Publish review platform
        id: deployment
        uses: actions/deploy-pages@v4
